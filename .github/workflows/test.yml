name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit:
    name: Unit tests on PHP ${{ matrix.php }}

    runs-on: ubuntu-latest
    if: "!github.event.pull_request.draft"

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Build the Codeception actors
        run: vendor/bin/codecept build

      - name: Unit suite
        run: vendor/bin/codecept run unit

  integration:
    name: Integration tests on the Docker environment

    runs-on: ubuntu-latest
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same environment used locally, PHP and WordPress versions come from .docker/test.env
      - name: Start the containers
        run: make up

      - name: Wait for WordPress
        run: timeout 180 sh -c 'until docker exec italystrap-asset_test test -f /var/www/html/wp-config.php; do sleep 2; done'

      - name: Install dependencies
        run: make install

      - name: Integration suite
        run: make integration

      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-output
          path: tests/_output
          if-no-files-found: ignore
